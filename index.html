<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAK Movers & Packers - Website Samples</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #f4f7f6;
            color: #1a1a1a;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .container { text-align: center; max-width: 800px; padding: 2rem; }
        h1 { font-size: 3rem; color: #004d99; margin-bottom: 0.5rem; }
        p { font-size: 1.2rem; color: #666; margin-bottom: 3rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; width: 100%; }
        .card { 
            background: #fff; padding: 3rem 2rem; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-decoration: none;
            color: #1a1a1a; transition: all 0.3s; border: 2px solid transparent;
        }
        .card:hover { transform: translateY(-5px); border-color: #ff6600; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .card h2 { font-size: 1.8rem; margin: 0 0 1rem 0; color: #004d99; }
        .badge { background: #e6ffe6; color: #009900; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <img src="sample1/assets/logo.png" alt="RAK Movers" style="height: 80px; margin-bottom: 1rem;">
        <h1>Select a Design Sample</h1>
        <p>Choose one of the premium design prototypes below to view the live website.</p>
        
        <div class="grid">
            <a href="sample1/index.html" class="card">
                <h2>Sample 1</h2>
                <p>Premium Corporate <br> (Active)</p>
                <span class="badge">READY TO VIEW</span>
            </a>
            <a href="#" class="card" style="opacity: 0.5; pointer-events: none;">
                <h2>Sample 2</h2>
                <p>Coming Soon</p>
            </a>
            <a href="#" class="card" style="opacity: 0.5; pointer-events: none;">
                <h2>Sample 3</h2>
                <p>Coming Soon</p>
            </a>
        </div>
    </div>
</body>
</html>
